[project]
name = "superpod-whitepaper-docs"
version = "0.1.0"
description = "SuperPod 技术白皮书 - 分布式 AI 推理加速架构"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocs-material-extensions>=1.3.1",
    "mkdocs-charts-plugin",
    "mkdocs-excalidraw",
    "mkdocs-heti-plugin",
    "mkdocs-encryptcontent-plugin>=3.1.0",              # 内容加密
    "jieba>=0.42.1",                                    # 中文搜索支持
    "pyyaml>=6.0.3",
    "pygments==2.20.0",
    "mkdocs-git-revision-date-localized-plugin>=1.5.3", # SEO & 站点增强
    "mkdocs-glightbox>=0.5.2",                          # 图片灯箱
    "mkdocs-minify-plugin>=0.8.0",                      # 构建优化
    "pillow>=12.3.0",
    "cairosvg>=2.9.0",
]
